<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>xDpod</title>
  <link rel="stylesheet" href="styles.css">
  <script src="player.js" defer></script>
</head>
<body>
  <main class="room">
    <section class="ipod">
      <div class="face">
        <div class="device-brand">xD</div>
        <div class="display-bezel">
          <div class="screen">
            <div class="screen-status">
              <time id="device-time">12:00</time>
              <span class="battery"><i></i></span>
            </div>
            <div class="screen-title" id="screen-title">Music</div>
            <div class="screen-view" id="screen-view"></div>
            <div class="screen-footer"><span id="screen-footer-left">2 songs</span><span id="screen-footer-right">♪</span></div>
          </div>
        </div>
        <div class="clickwheel" id="clickwheel">
          <button class="wheel-button wheel-menu" id="menu" type="button">MENU</button>
          <button class="wheel-button wheel-prev" id="previous" type="button">
            <svg viewBox="0 0 24 24"><path d="M6 5v14M19 6 8 12l11 6z" /></svg>
          </button>
          <button class="wheel-button wheel-next" id="next" type="button">
            <svg viewBox="0 0 24 24"><path d="M18 5v14M5 6l11 6-11 6z" /></svg>
          </button>
          <button class="wheel-button wheel-play" id="play" type="button">
            <svg class="play-glyph" viewBox="0 0 24 24"><path d="M7 5 19 12 7 19z" /></svg>
            <svg class="pause-glyph" viewBox="0 0 24 24"><path d="M7 5h3v14H7zM14 5h3v14h-3z" /></svg>
          </button>
          <button class="select-button" id="select" type="button"><span></span></button>
        </div>
        <div class="engraving">xDpod</div>
      </div>
      <div class="shell-edge"></div>
    </section>
    <p class="room-note" id="message"></p>
  </main>
  <audio id="audio" preload="metadata"></audio>
</body>
</html>
